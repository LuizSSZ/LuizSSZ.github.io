<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Micro Forum</title>
  <desc id="desc">Mini forum inspirado no micro reddit, publicado no GitHub.</desc>
  <rect width="800" height="450" fill="#151125"/>
  <rect x="60" y="95" width="680" height="260" rx="18" fill="#24203d" stroke="#b2ccff" stroke-opacity=".35"/>
  <text x="95" y="198" fill="#f1f5ff" font-family="Segoe UI, Arial" font-size="42" font-weight="700">Micro Forum</text>
  <text x="95" y="245" fill="#c7d9ff" font-family="Segoe UI, Arial" font-size="18" font-weight="600">Projeto de mini forum inspirado no micro reddit.</text>
  <text x="95" y="274" fill="#dde7ff" font-family="Segoe UI, Arial" font-size="16">Repositorio GitHub com foco em discussao simples e estrutura enxuta.</text>
</svg>
